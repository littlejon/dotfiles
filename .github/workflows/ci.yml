name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint and Check

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Run ShellCheck
        run: shellcheck -e SC1091,SC2034 ./.zshrc install.sh ./zsh_custom/aliases.zsh ./zsh_custom/history.zsh
