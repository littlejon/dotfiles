name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint and Check

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run ShellCheck
        run: shellcheck -e SC1091,SC2034 ./.zshrc install.sh ./zsh_custom/aliases.zsh ./zsh_custom/history.zsh
