name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint and Check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run ShellCheck
        run: shellcheck -e SC1091,SC2034 ./.zshrc install.sh ./zsh_custom/aliases.zsh ./zsh_custom/history.zsh
